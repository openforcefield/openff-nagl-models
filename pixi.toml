[workspace]
authors = ["Open Force Field Initiative <info@openforcefield.org>"]
channels = ["conda-forge"]
name = "openff-nagl-models-docs"
platforms = ["linux-64", "osx-arm64"]

[tasks]

[feature.docs.dependencies]
python = "*"
pip = "*"
myst-nb = "*"
myst-parser = ">=0.16"
docutils = "*"
sphinx = "6.*"
sphinx-notfound-page = "*"
autodoc-pydantic = "*"
sphinx-click = "*"

[feature.docs.pypi-dependencies]
openff-sphinx-theme = {
  git = "https://github.com/openforcefield/openff-sphinx-theme",
  rev = "main",
}
openff-nagl-models = { path = ".", editable = true }

[environments]
docs = [ "docs" ]
